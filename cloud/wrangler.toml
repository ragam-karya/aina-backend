# aina Cloud on Cloudflare Workers (Rust → WebAssembly with worker-build).
name = "badi-cloud"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

# One address: be.aina.ai.id. The workers.dev hostname is off (the website reaches this Worker through
# its service binding, not over workers.dev).
workers_dev = false
preview_urls = true
routes = [{ pattern = "be.aina.ai.id", custom_domain = true }]

# Workers Logs, sampled to stay well inside the free log quota.
[observability]
enabled = true
head_sampling_rate = 0.1

[build]
command = "cargo install -q worker-build && worker-build --release"

[vars]
PUBLIC_URL = "https://be.aina.ai.id"
# This Worker's other addresses, comma-separated: accepted as our own origin for cookie calls. None.
ALT_PUBLIC_URLS = ""
# BE-17, off while empty: the message the app's calls on an ALT_PUBLIC_URLS address get instead of an
# answer (HTTP 426), once old installs should update, e.g.
# "Versi aina ini sudah tidak didukung. Unduh versi terbaru di https://aina.ai.id/api/download".
RETIRED_HOST_MESSAGE = ""
# Base of the Composio OAuth redirect proxy (/api/composio-redirect) for auth configs registered with
# viaAina. Pinned so it never follows PUBLIC_URL by accident; whatever is set here must also be an
# Authorized redirect URI in the provider's OAuth app. (2026-11-09: no auth config uses viaAina.)
COMPOSIO_REDIRECT_BASE = "https://be.aina.ai.id"
# The website with the sign-in, plans and thanks pages; it reaches this Worker through its /api proxy
# (a service binding), so the session cookie lives on its domain.
FRONTEND_URL = "https://aina.ai.id"
GOOGLE_CLIENT_ID = "905981309985-ng04qcnc94pckpvc0unids6cu1l3ehc0.apps.googleusercontent.com"
MIDTRANS_PRODUCTION = "1"
# The closed beta: "1" lets in only the emails on the invite list (admin API), each with the beta credit.
# "0" (production): any Google account signs in on Free.
BETA = "0"
# Accounts that use aina without limits (never charged, buy nothing), comma-separated. Applied at sign-in.
UNLIMITED_EMAILS = "faisalmashuri16@gmail.com"
# For the daily analytics rollup (docs/analytics.md), with the secret CF_ANALYTICS_TOKEN.
CF_ACCOUNT_ID = "d4d0be3bd86e0bc6cbfea92a6bd3c86e"

# The Windows installer for /download (object windows/latest; uploaded per release, see README).
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "badi-downloads"

# Daily at 08:00 WIB: settle pending payments, then renew card subscriptions that are due.
[triggers]
crons = ["0 1 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "badi-cloud"
database_id = "ac19a76a-76ff-4d73-b13d-bb2aab5d856c"
migrations_dir = "migrations"

# Secrets (never in this file): wrangler secret put <NAME>
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, ELEVENLABS_API_KEY, COMPOSIO_API_KEY (ak_…),
#   COMPOSIO_AUTH_CONFIGS (JSON, optional white-label), MIDTRANS_SERVER_KEY (sandbox SB-Mid-server-… first),
#   MIDTRANS_SIGNATURE_KEY (the dashboard's Signature Secret Key, which signs payment notifications;
#   left unset, the Server Key is used, as older accounts sign with it),
#   GOOGLE_CLIENT_SECRET
#   ADMIN_TOKEN: the key for the admin API (/admin/beta, /admin/credit), at least 24 characters.

# Tracing of the AI calls (src/track.rs): one data point per call, without its content.
# Queries: docs/analytics.md.
[[analytics_engine_datasets]]
binding = "AI_CALLS"
dataset = "aina_ai_calls"
