[package]
name = "badi-cloud-core"
description = "Badi Cloud's rules without I/O: plans and cost limits, login codes and tokens, Midtrans checks, what a call may do, Composio scoping, and billing from Claude's usage. Shared by the Cloudflare Worker (cloud/) and tested natively."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
